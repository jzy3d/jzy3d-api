# Build and test Jzy3d on Linux, macOS (ARM + Intel) and Windows, then deploy
# SNAPSHOT artifacts to the Jzy3d Maven repository when master is updated, or when a pull request
# labeled deploy-snapshot is updated.
#
# Inspired by https://github.com/panama-gl/panama-gl/tree/main/.github/workflows
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Java CI with Maven

# Branches are built through their pull request, so that each commit is built once
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy SNAPSHOT artifacts after a successful build (whatever the branch)'
        type: boolean
        default: false

# Cancel superseded runs on branches and PRs, but let every master build complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # JDK 22+ is required by the PanamaGL modules (Foreign Function & Memory API)
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin

  # maven.jzy3d.org sometimes answers 403 to a burst of downloads : retry instead of failing the build
  MAVEN_OPTS: -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.serviceUnavailable=403,429,503

  # Integration tests. Some render the same charts with JOGL and PanamaGL. The others compare
  # charts to baseline images, which are built in ITTEST_BASELINES as no baseline exists for CI
  # runners : JOGL and EmulGL charts build them, and PanamaGL charts are compared to the JOGL ones.
  PANAMAGL_IT: ITTest_*
  ITTEST_BASELINES: target/ittest-baselines/

jobs:

  # ============================================================================================================
  # Build & Test Matrix
  # ============================================================================================================

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel other jobs if one platform fails
      fail-fast: false
      matrix:
        # Same platforms as PanamaGL CI
        os:
          - ubuntu-latest    # Linux x86_64
          - ubuntu-24.04-arm # Linux ARM64
          - macos-latest     # macOS ARM (Apple Silicon)
          - macos-15-intel   # macOS Intel x86_64 (last x86_64 image; GitHub Actions drops x86_64 ~Aug 2027)
          - windows-latest   # Windows x86_64 (Mesa D3D12 OpenGL, see below)
          - windows-11-arm   # Windows ARM64
        include:
          # Temurin provides no JDK 25 for Windows ARM64. JOGL 2.6 (GlueGen), SWT 3.116 and OpenJFX
          # provide no Windows ARM64 natives : build and test the modules not using them, and skip
          # integration tests, which compare PanamaGL to JOGL.
          - os: windows-11-arm
            distribution: zulu
            no-jogl: true
            maven-args: >-
              -am -pl 'jzy3d-tutorials/jzy3d-tutorials-panama-gl-swing,jzy3d-tutorials/jzy3d-tutorials-emul-gl-swing,jzy3d-io-xls'

    steps:
      # CI builds its own baseline images : skip the 300 MB of baselines stored in the repository
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/jzy3d-tests/jzy3d-tester-integration/src/test/resources/*_*/

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ matrix.distribution || env.JAVA_DISTRIBUTION }}
          cache: maven

      # Maven is not installed on every runner image (e.g. Windows ARM64)
      - name: Install Maven if missing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command mvn -ErrorAction SilentlyContinue) { exit 0 }
          $version = "3.9.11"
          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip" `
            -OutFile maven.zip
          Expand-Archive -Path maven.zip -DestinationPath C:\maven
          "C:\maven\apache-maven-$version\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # PanamaGL releases may be redeployed with the same version (implementation fixes without API
      # change), so never trust the copy restored from the Maven cache.
      - name: Remove PanamaGL from the Maven cache
        shell: bash
        run: rm -rf ~/.m2/repository/org/jzy3d/panama-gl*

      # -------------------------------------------------------
      # Linux: install Mesa OpenGL (software llvmpipe renderer),
      # GLUT (used by PanamaGL) and a virtual X display.
      # -------------------------------------------------------
      - name: Install OpenGL, GLUT and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dri libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev xvfb
          # Temurin's default java.library.path misses the multiarch folder where PanamaGL finds libGL
          echo "JAVA_TOOL_OPTIONS=-Djava.library.path=/usr/lib/$(uname -m)-linux-gnu:/usr/lib" >> $GITHUB_ENV

      - name: Configure OpenGL library path (macOS)
        if: runner.os == 'macOS'
        run: echo "JAVA_TOOL_OPTIONS=-Djava.library.path=.:/System/Library/Frameworks/OpenGL.framework/Versions/Current/Libraries/" >> $GITHUB_ENV

      # -------------------------------------------------------
      # Windows: the system opengl32.dll only supports OpenGL 1.1
      # without a GPU, which is not enough for JOGL nor PanamaGL.
      # Install Mesa D3D12 (OpenGL 4.6 on WARP, the software D3D12
      # renderer of Windows, as validated on panama-gl CI) next to java.exe:
      # Windows searches the application directory before System32
      # when loading a DLL, so every JVM started from this JDK (Maven
      # and Surefire forks) picks Mesa instead of the system stub.
      # -------------------------------------------------------
      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod `
            "https://api.github.com/repos/mmozeiko/build-mesa/releases/latest" `
            -Headers $headers
          $asset = $release.assets `
            | Where-Object { $_.name -like "mesa-d3d12-$arch-*.7z" } `
            | Select-Object -First 1
          if (-not $asset) { Write-Error "Could not find mesa-d3d12-$arch asset"; exit 1 }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $dlls = Get-ChildItem -Path "mesa" -Recurse -Filter "*.dll"
          if (-not ($dlls | Where-Object { $_.Name -eq "opengl32.dll" })) {
            Write-Error "opengl32.dll not found in Mesa archive"; exit 1
          }
          $javaBin = Join-Path $env:JAVA_HOME "bin"
          $dlls | Copy-Item -Destination $javaBin -Force
          Write-Host "Installed Mesa DLLs to $javaBin : $($dlls.Name -join ', ')"
          # JOGL calls the GDI versions of ChoosePixelFormat, SetPixelFormat... which fail with
          # Mesa ("Unable to set pixel format ... error code 1004"). Let it call their WGL
          # versions, provided by Mesa opengl32.dll, in every JVM including Surefire forks.
          "JAVA_TOOL_OPTIONS=-Djogl.windows.useWGLVersionOf5WGLGDIFuncSet=true" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Windows: freeglut (used by PanamaGL) has no Chocolatey
      # package and transmissionzero.co.uk is not reachable from
      # GitHub runners, so build it with vcpkg, preinstalled on most Windows runners.
      # -------------------------------------------------------
      - name: Install freeglut (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path "$vcpkg\vcpkg.exe")) {
            $vcpkg = "C:\vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkg
            & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$vcpkg\vcpkg.exe" install "freeglut:$arch-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Join-Path $vcpkg "installed\$arch-windows\bin\freeglut.dll"
          if (-not (Test-Path $dll)) { Write-Error "freeglut.dll not found at $dll"; exit 1 }
          Copy-Item -Path $dll -Destination "C:\Windows\System32\freeglut.dll"
          Copy-Item -Path $dll -Destination (Join-Path $env:JAVA_HOME "bin")
          Write-Host "Installed freeglut.dll from $dll"

      - name: Get Maven OS detection info
        run: mvn --batch-mode --no-transfer-progress enforcer:display-info

      # -------------------------------------------------------
      # Build & Test
      # Linux uses xvfb-run for the virtual display required by
      # AWT/Swing/SWT/JavaFX components during tests.
      # -------------------------------------------------------
      - name: Build and test with Maven (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            mvn --batch-mode --no-transfer-progress --fail-at-end package --file pom.xml ${{ matrix.maven-args }}

      - name: Build and test with Maven (macOS, Windows)
        if: runner.os != 'Linux'
        run: mvn --batch-mode --no-transfer-progress --fail-at-end package --file pom.xml ${{ matrix.maven-args }}

      # -------------------------------------------------------
      # Integration tests comparing PanamaGL to JOGL renderings
      # made on the same runner, hence independent of the
      # baseline images stored in the repository.
      # -------------------------------------------------------
      - name: PanamaGL integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            mvn --batch-mode --no-transfer-progress test -pl jzy3d-tests/jzy3d-tester-integration -am \
              -Dtest="$PANAMAGL_IT" -Dsurefire.failIfNoSpecifiedTests=false \
              -Djzy3d.ittest.baselines="$ITTEST_BASELINES"

      # An unset matrix value equals false in expressions, hence a flag set where JOGL is missing
      - name: PanamaGL integration tests (macOS, Windows)
        if: runner.os != 'Linux' && !matrix.no-jogl
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress test -pl jzy3d-tests/jzy3d-tester-integration -am \
            -Dtest="$PANAMAGL_IT" -Dsurefire.failIfNoSpecifiedTests=false \
            -Djzy3d.ittest.baselines="$ITTEST_BASELINES"

      # -------------------------------------------------------
      # Print JVM crash details (forked test JVM killed by a native
      # crash) as artifacts can't always be inspected easily.
      # -------------------------------------------------------
      - name: Print JVM crash dumps (Unix)
        if: runner.os != 'Windows' && failure()
        run: |
          for f in $(find . -path "*/target/surefire-reports/*" -name "*.dumpstream") $(find . -name "hs_err_pid*.log"); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            for f in $(ls ~/Library/Logs/DiagnosticReports/java* 2>/dev/null); do
              echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"
            done
          fi

      # -------------------------------------------------------
      # Collect Surefire reports (always, even on test failure)
      # -------------------------------------------------------
      - name: Collect Surefire reports (Unix)
        if: runner.os != 'Windows' && always()
        run: |
          mkdir -p surefire-reports
          find . -path "*/target/surefire-reports/*" -type f -exec cp {} surefire-reports/ \;
          find jzy3d-tests/jzy3d-tester-integration/target -name "*.png" -not -path "*/ittest-baselines/*" -exec cp {} surefire-reports/ \; || true

      - name: Collect Surefire reports (Windows)
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path surefire-reports | Out-Null
          Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.FullName -like "*\target\surefire-reports\*" } |
            Copy-Item -Destination surefire-reports
          Get-ChildItem -Path jzy3d-tests\jzy3d-tester-integration\target -Recurse -Filter *.png -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\ittest-baselines\*" } |
            Copy-Item -Destination surefire-reports

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports-${{ matrix.os }}
          path: surefire-reports
          if-no-files-found: ignore

  # ============================================================================================================
  # Older JDKs supported by Jzy3d. Modules requiring a more recent JDK are excluded by the java11 and java22
  # profiles of the root pom : SWT and JavaFX need Java 11, PanamaGL needs Java 22.
  # ============================================================================================================

  build-jdk:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # LTS versions, and 22, the first version providing the stable FFM API required by PanamaGL.
        # JDK 25 (LTS) is also used by the build job above, on all platforms.
        java: ['8', '11', '17', '21', '22', '25']

    steps:
      # CI builds its own baseline images : skip the 300 MB of baselines stored in the repository
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/jzy3d-tests/jzy3d-tester-integration/src/test/resources/*_*/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Remove PanamaGL from the Maven cache
        run: rm -rf ~/.m2/repository/org/jzy3d/panama-gl*

      - name: Install OpenGL, GLUT and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dri libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev xvfb
          echo "JAVA_TOOL_OPTIONS=-Djava.library.path=/usr/lib/x86_64-linux-gnu:/usr/lib" >> $GITHUB_ENV

      - name: Build and test with Maven
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            mvn --batch-mode --no-transfer-progress --fail-at-end package --file pom.xml

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  # ============================================================================================================
  # Deploy SNAPSHOT to the Jzy3d Maven FTP repository (see distributionManagement in pom.xml).
  #
  # Runs after all platforms passed : on push to master, when manually triggered with 'deploy'
  # checked, or on pull requests labeled deploy-snapshot. Release versions are never deployed from CI.
  #
  # Requires the FTP_URL (e.g. ftp://ftp.example.org), FTP_USERNAME and FTP_PASSWORD secrets of the
  # "jzy3d-ftp-env" environment, as PanamaGL CI does with its "panama-ftp-env" environment.
  # ============================================================================================================

  deploy:
    name: Deploy SNAPSHOT
    runs-on: ubuntu-latest
    needs: [build, build-jdk]
    # Also deploy pull requests labeled deploy-snapshot, for projects built against their branch
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-snapshot'))
    environment: jzy3d-ftp-env

    steps:
      # CI builds its own baseline images : skip the 300 MB of baselines stored in the repository
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/jzy3d-tests/jzy3d-tester-integration/src/test/resources/*_*/

      # Writes ~/.m2/settings.xml with credentials for the server id used in distributionManagement
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: jzy3d-ftp
          server-username: FTP_USERNAME
          server-password: FTP_PASSWORD

      - name: Check version is a SNAPSHOT
        run: |
          VERSION=$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Version $VERSION is not a SNAPSHOT, refusing to deploy a release from CI"
            exit 1
          fi

      - name: Deploy
        run: |
          if [ -z "$MAVEN_REPO_URL" ] || [ -z "$FTP_USERNAME" ]; then
            echo "::error::Secrets FTP_URL, FTP_USERNAME and FTP_PASSWORD of the jzy3d-ftp-env environment are required"
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          MAVEN_REPO_URL: ${{ secrets.FTP_URL }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
