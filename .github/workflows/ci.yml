# Build and test Jzy3d with JOGL and PanamaGL on Linux, macOS (ARM + Intel) and Windows.
# GitHub hosted runners have no GPU : Linux uses Mesa llvmpipe in Xvfb, macOS its software
# renderer, Windows the Mesa D3D12 OpenGL driver running on WARP.

name: CI

on:
  push:
  pull_request:

env:
  # PanamaGL is built from source until a release provides the GL function loader
  # (panama-gl/panama-gl#12)
  PANAMAGL_REPOSITORY: panama-gl/panama-gl
  PANAMAGL_REF: feature/gl-function-loader

  # PanamaGL integration tests, comparing JOGL and PanamaGL renderings on the same runner
  PANAMAGL_IT: ITTest_PanamaGLParity,ITTest_GPUDrawables,ITTest_DepthPeeling,ITTest_Picking

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest    # Linux x86_64
          - macos-latest     # macOS ARM (Apple Silicon)
          - macos-15-intel   # macOS Intel x86_64
          - windows-latest   # Windows x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Checkout PanamaGL
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PANAMAGL_REPOSITORY }}
          ref: ${{ env.PANAMAGL_REF }}
          path: panama-gl

      # PanamaGL requires Java 22+ (Foreign Function & Memory API), Jzy3d modules target Java 8
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven

      # -------------------------------------------------------
      # Native OpenGL libraries
      # -------------------------------------------------------
      - name: Install OpenGL and GLUT libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev xvfb
          echo "JAVA_TOOL_OPTIONS=-Djava.library.path=/usr/lib/x86_64-linux-gnu:/usr/lib" >> $GITHUB_ENV

      - name: Configure OpenGL library path (macOS)
        if: runner.os == 'macOS'
        run: echo "JAVA_TOOL_OPTIONS=-Djava.library.path=.:/System/Library/Frameworks/OpenGL.framework/Versions/Current/Libraries/" >> $GITHUB_ENV

      # freeglut.dll is loaded by PanamaGL WGL contexts
      - name: Install freeglut (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = $null
          try {
            Invoke-WebRequest `
              -Uri "https://www.transmissionzero.co.uk/files/software/development/GLUT/freeglut-MSVC.zip" `
              -OutFile "freeglut-MSVC.zip"
            Expand-Archive -Path "freeglut-MSVC.zip" -DestinationPath "C:\freeglut"
            $dll = Get-ChildItem -Path "C:\freeglut" -Recurse -Filter "freeglut.dll" `
              | Where-Object { $_.FullName -like "*x64*" } `
              | Select-Object -First 1
          } catch {
            Write-Host "Could not download freeglut-MSVC.zip : $_"
          }
          if (-not $dll) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install freeglut:x64-windows
            if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg could not install freeglut"; exit 1 }
            $dll = Get-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\freeglut.dll"
          }
          Copy-Item -Path $dll.FullName -Destination "C:\Windows\System32\freeglut.dll"
          Write-Host "Installed freeglut.dll from $($dll.FullName)"

      # The system opengl32.dll of Windows runners only supports OpenGL 1.1. Mesa D3D12 provides
      # OpenGL 4.6 on WARP. It is copied in the JDK bin folder, searched first by Windows when JOGL
      # loads opengl32.dll, and in C:\mesa, given to PanamaGL through java.library.path.
      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod `
            "https://api.github.com/repos/mmozeiko/build-mesa/releases/latest" `
            -Headers $headers
          $asset = $release.assets `
            | Where-Object { $_.name -like "mesa-d3d12-x64-*.7z" } `
            | Select-Object -First 1
          if (-not $asset) { Write-Error "Could not find mesa-d3d12-x64 asset"; exit 1 }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $dll = Get-ChildItem -Path "mesa" -Recurse -Filter "opengl32.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "opengl32.dll not found in Mesa archive"; exit 1 }
          New-Item -ItemType Directory -Force -Path "C:\mesa" | Out-Null
          Copy-Item -Path "$($dll.DirectoryName)\*.dll" -Destination "C:\mesa" -Force
          Copy-Item -Path "$($dll.DirectoryName)\*.dll" -Destination "$env:JAVA_HOME\bin" -Force
          Write-Host "Installed Mesa OpenGL : $((Get-ChildItem C:\mesa).Name -join ', ')"
          "JAVA_TOOL_OPTIONS=-Djava.library.path=C:\mesa;C:\Windows\System32" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------
      - name: Install PanamaGL
        run: mvn --batch-mode --no-transfer-progress install -DskipTests --file panama-gl/pom.xml

      - name: Build Jzy3d
        run: mvn --batch-mode --no-transfer-progress install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true

      # -------------------------------------------------------
      # Tests : failures are reported by the last step, so that
      # all modules and the integration tests run anyway
      # -------------------------------------------------------
      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            mvn --batch-mode --no-transfer-progress test -Dmaven.test.failure.ignore=true

      - name: Unit tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: mvn --batch-mode --no-transfer-progress test -Dmaven.test.failure.ignore=true

      - name: PanamaGL integration tests (Linux)
        if: runner.os == 'Linux'
        working-directory: jzy3d-tests-java9
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            mvn --batch-mode --no-transfer-progress test -Dmaven.test.failure.ignore=true \
              -Dtest="$PANAMAGL_IT" -Dsurefire.failIfNoSpecifiedTests=false

      - name: PanamaGL integration tests (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: jzy3d-tests-java9
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress test -Dmaven.test.failure.ignore=true \
            -Dtest="$PANAMAGL_IT" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Collect test reports
        if: always()
        shell: bash
        run: |
          mkdir -p test-reports
          for f in $(find . -path ./panama-gl -prune -o -path "*/target/surefire-reports/*" -type f -print); do
            module=$(echo "$f" | cut -d/ -f2)
            mkdir -p "test-reports/$module"
            cp "$f" "test-reports/$module/"
          done
          find jzy3d-tests-java9/target -name "*.png" -exec cp {} test-reports/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: test-reports
          if-no-files-found: ignore

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.x'

      - name: Test results
        if: always()
        run: python .github/scripts/test_summary.py "Tests on ${{ matrix.os }}" .
